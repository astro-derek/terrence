[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrence"
version = "0.1.0"
description = "Directory-local background BitTorrent client"
requires-python = ">=3.10"
dependencies = ["libtorrent>=2.0.11,<3"]

[project.scripts]
terrence = "terrence.cli:main"

[tool.setuptools.packages.find]
include = ["terrence*"]
